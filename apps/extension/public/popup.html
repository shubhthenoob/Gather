<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gather</title>
  <style>
    :root { --bg:#fff; --text:#202124; --muted:#5f6368; --border:#e0e0e0; --accent:#fbbc04; }
    @media (prefers-color-scheme: dark) { :root { --bg:#202124; --text:#e8eaed; --muted:#9aa0a6; --border:#3c4043; } }
    * { box-sizing: border-box; }
    body { margin:0; width:300px; background:var(--bg); color:var(--text); font:13px/1.45 Inter, system-ui, "Segoe UI", sans-serif; }
    header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border); font-weight:600; font-size:15px; }
    header img { width:22px; height:22px; }
    section { padding:12px 14px; border-bottom:1px solid var(--border); }
    section:last-child { border-bottom:0; }
    .muted { color:var(--muted); }
    .row { display:flex; align-items:center; gap:10px; }
    .avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); }
    button, a.btn { display:block; width:100%; text-align:center; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:transparent; color:inherit; font:inherit; font-weight:500; cursor:pointer; text-decoration:none; }
    .primary { background:var(--accent)!important; border-color:var(--accent)!important; color:#202124!important; }
    .stack > * + * { margin-top:8px; }
    .warn { color:#e37400; }
    [hidden] { display:none!important; }
    .hint { margin:0; font-size:12px; text-align:center; }
    .hint a { color:inherit; font-weight:600; }
  </style>
</head>
<body>
  <header><img src="icons/32.png" alt="" /> Gather</header>
  <section id="account"><p class="muted">Loading…</p></section>
  <section id="page"></section>
  <section class="stack">
    <a id="open" class="btn" target="_blank" rel="noopener">Open my library</a>
    <p class="muted hint">Everything you save lives at <a id="site" target="_blank" rel="noopener"></a>, organised by date and searchable.</p>
    <button id="signout" hidden>Sign out</button>
  </section>
  <script src="popup.js"></script>
</body>
</html>
