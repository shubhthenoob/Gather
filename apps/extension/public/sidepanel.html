<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gather</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#ffffff; --surface:#f6f7f9; --card:#ffffff; --text:#202124; --muted:#5f6368; --border:#e3e5e8;
      --accent:#fbbc04; --accent-hover:#fdd663; --danger:#d93025; --hover:rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1b1c1f; --surface:#202124; --card:#26272b; --text:#e8eaed; --muted:#9aa0a6; --border:#3c4043; --hover:rgba(255,255,255,.07); --danger:#f28b82; }
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    html, body { overflow-x:hidden; }
    body > * { min-width:0; max-width:100%; }
    .controls > *, .chips { min-width:0; max-width:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 Inter, system-ui, "Segoe UI", sans-serif; display:flex; flex-direction:column; }
    button { font:inherit; color:inherit; }
    [hidden] { display:none !important; }
    .muted { color:var(--muted); }

    header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); }
    header .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; flex:1; }
    header img { width:20px; height:20px; }
    .avatar { width:26px; height:26px; border-radius:50%; background:var(--accent); object-fit:cover; }
    .icon-btn { border:0; background:transparent; padding:6px; border-radius:8px; cursor:pointer; color:var(--muted); display:inline-flex; align-items:center; gap:4px; }
    .icon-btn:hover { background:var(--hover); color:var(--text); }
    .icon-btn:focus-visible, .chip:focus-visible, .btn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
    .btn { border:1px solid var(--border); background:transparent; border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:500; }
    .btn:hover { background:var(--hover); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#202124; }
    .btn.primary:hover { background:var(--accent-hover); }
    .btn.danger { color:var(--danger); }

    .banner { margin:10px 12px 0; padding:10px 12px; border-radius:10px; background:var(--surface); display:flex; gap:10px; align-items:flex-start; }
    .banner p { margin:0; flex:1; }

    .controls { padding:10px 12px 6px; display:flex; flex-direction:column; gap:8px; }
    .search { position:relative; }
    .search input { width:100%; padding:8px 30px 8px 32px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text); font:inherit; outline:none; }
    .search input:focus { border-color:var(--accent); }
    .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
    .search .clear { position:absolute; right:4px; top:50%; transform:translateY(-50%); }
    .seg { display:flex; background:var(--surface); border-radius:999px; padding:3px; }
    .seg button { flex:1; border:0; background:transparent; border-radius:999px; padding:5px 0; cursor:pointer; font-weight:500; color:var(--muted); }
    .seg button[aria-pressed="true"] { background:var(--card); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.15); }
    .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; mask-image:linear-gradient(to right, #000 85%, transparent); }
    .chips::-webkit-scrollbar { display:none; }
    .chip { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; border:1px solid var(--border); background:transparent; border-radius:999px; padding:4px 10px; cursor:pointer; font-size:12px; }
    .chip[aria-pressed="true"] { background:var(--text); color:var(--bg); border-color:var(--text); }
    .chip .count { opacity:.65; }
    .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
    .dot.hollow { background:transparent !important; box-shadow:inset 0 0 0 1.5px var(--muted); }

    main { flex:1; overflow-y:auto; padding:4px 12px 16px; }
    .summary { margin:6px 2px 8px; font-size:12px; color:var(--muted); }
    .group { margin:14px 0 6px; display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; }
    .group img { width:14px; height:14px; border-radius:3px; }
    .group a { color:inherit; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .group a:hover { text-decoration:underline; }

    .card { position:relative; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px 8px 16px; margin-bottom:8px; overflow:hidden; }
    .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--bar, var(--accent)); }
    .card.clickable { cursor:pointer; }
    .card.clickable:hover { border-color:var(--muted); }
    .quote { margin:0; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .card.expanded .quote { -webkit-line-clamp:unset; display:block; }
    .note { margin-top:8px; padding:6px 10px; border-left:3px solid var(--accent); background:var(--surface); border-radius:6px; white-space:pre-wrap; font-weight:500; }
    .unresolved { margin-top:6px; font-size:12px; color:#e37400; }
    .card-cats { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
    .card-cats .chip { padding:2px 8px; font-size:11px; }
    .source { display:block; margin-top:8px; font-size:12px; color:var(--muted); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .source:hover { color:var(--text); text-decoration:underline; }
    .card-actions { display:flex; gap:2px; margin-top:6px; margin-left:-6px; }
    .card-actions .icon-btn { font-size:12px; }
    .card-actions .icon-btn.done { color:#188038; }
    textarea { width:100%; margin-top:8px; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font:inherit; resize:vertical; min-height:64px; outline:none; }
    textarea:focus { border-color:var(--accent); }
    .row-end { display:flex; justify-content:flex-end; gap:6px; margin-top:6px; }

    .empty { text-align:center; padding:36px 12px; color:var(--muted); }
    .empty strong { color:var(--text); display:block; margin-bottom:6px; font-size:14px; }

    /* Category picker / palette popovers */
    .pop { position:fixed; z-index:10; width:250px; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.2); padding:8px; }
    .pop input[type=text] { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font:inherit; outline:none; margin-bottom:6px; }
    .pop input[type=text]:focus { border-color:var(--accent); }
    .pop-list { max-height:240px; overflow-y:auto; }
    .pop-row { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; width:100%; border:0; background:transparent; text-align:left; }
    .pop-row:hover, .pop-row.active { background:var(--hover); }
    .pop-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pop-row .tick { width:16px; text-align:center; font-weight:700; color:var(--text); }
    .pop-row.create { color:#b06000; }
    @media (prefers-color-scheme: dark) { .pop-row.create { color:var(--accent); } }
    .palette { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:4px; }
    .swatch { width:100%; aspect-ratio:1; border-radius:50%; border:2px solid transparent; cursor:pointer; }
    .swatch[aria-pressed="true"] { border-color:var(--text); }
    .custom { display:flex; align-items:center; gap:8px; margin-top:8px; padding:4px; }
    .custom input[type=color] { width:32px; height:32px; border:0; padding:0; background:transparent; cursor:pointer; }
    .custom input[type=text] { margin:0; font-family:ui-monospace, monospace; }

    /* Categories view */
    .cat-card { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:8px; }
    .cat-card .info { flex:1; min-width:0; }
    .cat-card .name { font-weight:600; border:0; background:transparent; padding:0; cursor:pointer; text-align:left; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cat-card .name:hover { text-decoration:underline; }
    .cat-card .preview { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cat-card .dot { width:16px; height:16px; cursor:pointer; border:0; padding:0; }
    .cat-card input { width:100%; padding:4px 8px; border:1px solid var(--accent); border-radius:6px; background:var(--surface); color:var(--text); font:inherit; outline:none; }

    footer { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-top:1px solid var(--border); }
    .toast { position:fixed; left:50%; bottom:56px; transform:translateX(-50%); background:#202124; color:#e8eaed; padding:8px 8px 8px 14px; border-radius:10px; display:flex; align-items:center; gap:10px; box-shadow:0 6px 18px rgba(0,0,0,.3); z-index:20; white-space:nowrap; }
    .toast button { border:0; background:var(--accent); color:#202124; border-radius:8px; padding:5px 10px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="icons/32.png" alt="" /> Gather</div>
    <div id="account"></div>
  </header>

  <div id="banner" class="banner" hidden>
    <p><strong>Saved on this device only.</strong> <span class="muted">Sign in to keep your highlights safe and see them everywhere.</span></p>
    <button id="banner-close" class="icon-btn" aria-label="Dismiss">✕</button>
  </div>

  <div class="controls" id="list-controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <input id="q" type="search" placeholder="Search highlights &amp; notes" aria-label="Search highlights and notes" autocomplete="off" />
      <button id="q-clear" class="icon-btn clear" aria-label="Clear search" hidden>✕</button>
    </div>
    <div class="seg" role="group" aria-label="Show highlights from">
      <button id="scope-page" aria-pressed="true">This page</button>
      <button id="scope-all" aria-pressed="false">All</button>
    </div>
    <div id="chips" class="chips" role="group" aria-label="Filter by category"></div>
  </div>

  <main id="main" aria-live="polite"></main>

  <footer>
    <button id="toggle-view" class="btn">Categories</button>
    <button id="open-library" class="btn">Open library ↗</button>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
